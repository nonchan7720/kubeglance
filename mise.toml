[tool_alias]
golangci-lint = "go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint"

[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
helm = "3.22.1"
"aqua:goreleaser/goreleaser" = "2.19.0"
# dependency-graph analysis (.depgraph.yml): the claude-hook-gate session_start /
# gate entries and CI (depgraph:ci) use it
"github:nonchan7720/depgraph" = "0.1.7"
# THIRD_PARTY_NOTICES.md (mise run notices; CI checks it is current)
"go:github.com/google/go-licenses/v2" = "2.0.1"
# end-to-end tests on a kind cluster (mise run e2e)
"aqua:kubernetes-sigs/kind" = "0.33.0"
"aqua:kubernetes/kubectl" = "1.37.2"

[env]
# pure Go, static binary; cross-compiles with plain `go build`
CGO_ENABLED = "0"
_.path = ["bin"]
# depgraph's Neo4j (compose.yaml; local development credentials)
NEO4J_URI = "bolt://localhost:27687"
NEO4J_USER = "neo4j"
NEO4J_PASSWORD = "kubeglance123"
NEO4J_DATABASE = "neo4j"
# depgraph's UI, moved off its default 7777
DEPGRAPH_ADDR = "127.0.0.1:27777"

# ---------------------------------------------------------------------------
# setup / build
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Install toolchain, download modules and build the binary"
run = ["mise install", "go mod download", "mise run build"]

[tasks.deps]
description = "go mod tidy"
run = "go mod tidy"

[tasks.build]
description = "Build ./bin/kubeglance"
sources = ["main.go", "pkg/**/*", "go.mod", "go.sum"]
outputs = ["bin/kubeglance"]
run = "go build -trimpath -ldflags '-s -w -X github.com/nonchan7720/kubeglance/pkg/version.Version=dev' -o bin/kubeglance ."

[tasks.run]
description = "Run against the current kubeconfig context (out-of-cluster)"
depends = ["build"]
run = "bin/kubeglance --addr 127.0.0.1:8080"

[tasks.dev]
description = "Serve the UI with synthetic data (no cluster needed) at http://127.0.0.1:8080"
run = "go run ./internal/devserver"

# ---------------------------------------------------------------------------
# quality
# ---------------------------------------------------------------------------

[tasks.fmt]
description = "gofmt + goimports via golangci-lint"
run = "golangci-lint fmt ./..."

[tasks.lint]
# includes govet (see .golangci.yml), so there is no separate vet task
run = "golangci-lint run ./..."

[tasks.test]
# tests run with the race detector, which needs cgo; only the tests, the
# binary itself stays CGO_ENABLED=0
env = { CGO_ENABLED = "1" }
run = "go test -race -count=1 ./..."

[tasks."helm:lint"]
# render.sh renders the value combinations that switch templates on and off
# (PDB, NetworkPolicy) and checks what comes out
run = ["helm lint charts/kubeglance", "helm template kubeglance charts/kubeglance >/dev/null", "bash charts/tests/render.sh"]

[tasks.notices]
description = "Regenerate THIRD_PARTY_NOTICES.md from the modules the binary links (every release GOOS)"
run = "bash scripts/notices.sh > THIRD_PARTY_NOTICES.md"

[tasks."notices:check"]
description = "Fail when THIRD_PARTY_NOTICES.md is stale or a dependency has a forbidden / restricted license"
run = [
  "for os in linux darwin windows; do GOOS=$os go-licenses check . --ignore github.com/nonchan7720/kubeglance --disallowed_types=forbidden,restricted 2>/dev/null || { echo \"forbidden or restricted license for GOOS=$os\"; exit 1; }; done",
  'bash scripts/notices.sh | diff -u THIRD_PARTY_NOTICES.md - >/dev/null || { echo "THIRD_PARTY_NOTICES.md is stale: run mise run notices"; exit 1; }',
]

[tasks.e2e]
description = "End-to-end tests on a kind cluster: metrics-server, two replicas, alerts, a rolling update (needs Docker; E2E_KEEP=1 keeps the cluster)"
run = "bash scripts/e2e.sh"

[tasks.ci]
description = "Everything CI runs"
depends = ["lint", "test", "helm:lint", "build", "notices:check"]

# ---------------------------------------------------------------------------
# depgraph (dependency analysis; Neo4j from compose.yaml)
# ---------------------------------------------------------------------------

[tasks.neo4j]
description = "Start depgraph's Neo4j (compose.yaml) and wait until healthy"
run = "docker compose up -d --wait neo4j"

[tasks."neo4j:down"]
description = "Stop Neo4j (the data volume is kept)"
run = "docker compose stop neo4j"

[tasks."depgraph:scan"]
description = "Scan this repository into Neo4j and update CLAUDE.md"
depends = ["neo4j"]
run = "depgraph scan --root ."

[tasks."depgraph:watch"]
description = "Watch file changes, keep the graph and CLAUDE.md current (UI: http://127.0.0.1:27777)"
depends = ["neo4j"]
run = "depgraph watch --root ."

[tasks."depgraph:ci"]
description = "Same check as CI: scan and fail on warn-or-worse findings (CLAUDE.md untouched)"
depends = ["neo4j"]
# external provider so depgraph does not start its own Neo4j container; no
# --reset, which would also erase the gate baselines (HookSession) mid-session
run = 'depgraph scan --root . --neo4j-provider external --claude-md "" --fail-on warn'

[tasks."depgraph:serve"]
description = "depgraph's browser UI (http://127.0.0.1:27777)"
depends = ["neo4j"]
run = "depgraph serve --root ."
