name: Release please

on:
  push:
    branches:
      - main
      - release/v[0-9]* # release/v1, release/v1.0, release/v1.0.0

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A GitHub App token, not GITHUB_TOKEN: PRs opened by GITHUB_TOKEN do
      # not trigger CI, and Actions may not be allowed to open PRs at all.
      - name: Setup app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_PEM }}
          owner: ${{ github.repository_owner }}
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: release-please/config.json
          manifest-file: release-please/manifest.json
          target-branch: ${{ github.ref_name }}

  goreleaser:
    # A release: binaries, multi-arch images and the Helm chart for the tag.
    # Any other push to main: a prerelease v<next>-dev.<sha> with the same
    # artifacts, so main is always installable.
    runs-on: ubuntu-latest
    needs: release-please
    env:
      IS_RELEASED: ${{ needs.release-please.outputs.release_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || github.sha }}
      - name: Create prerelease tag
        if: env.IS_RELEASED != 'true'
        run: |
          BASE=$(jq -r '."."' release-please/manifest.json)
          SHORT_SHA=$(git rev-parse --short HEAD)
          git tag "v${BASE}-dev.${SHORT_SHA}"
      - name: Setup app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_PEM }}
          owner: ${{ github.repository_owner }}
      - name: Set up tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser (Stable)
        if: env.IS_RELEASED == 'true'
        run: mise exec -- goreleaser release --clean --config .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
      - name: Run GoReleaser (Prerelease)
        if: env.IS_RELEASED != 'true'
        run: mise exec -- goreleaser release --clean --config .goreleaser.prerelease.yaml
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
      - name: Push Helm chart
        if: env.IS_RELEASED == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | mise exec -- helm registry login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          mise exec -- helm package charts/kubeglance -d dist/chart
          mise exec -- helm push dist/chart/kubeglance-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
