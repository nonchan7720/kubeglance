# Default values for kubeglance.

image:
  repository: ghcr.io/nonchan7720/kubeglance
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Two replicas give zero-downtime updates with no history loss: a starting
# replica copies the history from the running one before it becomes ready.
# One replica works too; history is then lost on restart unless snapshot is on.
replicaCount: 2

# Poll interval. Empty follows metrics-server's --metric-resolution, also when
# it changes while kubeglance runs (15s on k3s; managed clusters may differ).
# Polling faster than that resolution reads every value twice; set this only
# to fix the interval.
interval: ""
# How much history to keep in memory per replica. See README "Memory".
retention: 24h
logLevel: info
# preStop sleep (seconds) before SIGTERM; 0 disables. Needs Kubernetes >= 1.30
# (the Sleep lifecycle action). The binary also keeps serving peers for
# --shutdown-grace after SIGTERM.
preStopSleepSeconds: 5

# Optional on-disk safety net for the case where every replica is down at
# once. The peer copy, not this, is what makes rolling updates lossless.
snapshot:
  enabled: false
  every: 1m
  # emptyDir survives container restarts but not pod deletion; use a PVC for
  # a node reboot. With replicaCount > 1 the volume must be ReadWriteMany or
  # the pods must land on the same node; usually leave this off and rely on peers.
  persistence:
    enabled: false
    storageClass: ""
    size: 256Mi
    accessMode: ReadWriteOnce

# Optional token on the UI, the API and /metrics (Basic auth password with
# any user name, or a Bearer token). Off by default: the recommended way is to
# keep kubeglance off the internet and reach it through Tailscale, Cloudflare
# Access or an authenticating Ingress. Name a Secret you created yourself;
# the chart never takes the token as a value:
#   kubectl -n kubeglance create secret generic kubeglance-auth --from-literal=token=$(openssl rand -hex 24)
auth:
  existingSecret: ""
  key: token

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kubeglance.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
# Spread the replicas over nodes so one node going down keeps the history.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: kubeglance

# Keeps one replica through a node drain (minAvailable: 1). Rendered only
# when replicaCount > 1.
podDisruptionBudget:
  enabled: true

# Restricts traffic to what kubeglance needs. Off by default because what
# "the Ingress controller" and "the API server" are differs per cluster.
networkPolicy:
  enabled: false
  # NetworkPolicyPeers allowed to reach the UI / API on port 8080, besides
  # the other replicas. Empty: only the replicas (kubectl port-forward is
  # not subject to NetworkPolicy). For example the Ingress controller:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  ingressFrom: []
  # The Kubernetes API server (it also serves metrics.k8s.io). Empty cidrs
  # allow these ports to any address; pin them to the API server's address
  # (`kubectl get endpoints kubernetes`) for a tighter policy.
  apiServer:
    cidrs: []
    ports: [443, 6443]

serviceAccount:
  create: true
  annotations: {}
  name: ""
rbac:
  create: true
