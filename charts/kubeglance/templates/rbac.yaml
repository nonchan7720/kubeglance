{{- if .Values.rbac.create }}
# Read-only: list/watch of pods, nodes, replicasets and jobs for the owner
# mapping, and the metrics API. kubeglance never writes to the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeglance.fullname" . }}
  labels:
    {{- include "kubeglance.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeglance.fullname" . }}
  labels:
    {{- include "kubeglance.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeglance.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeglance.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
