{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# Ingress: the peers (history copy) and whatever networkPolicy.ingressFrom
# names, on the HTTP port. Egress: DNS, the Kubernetes API server (which also
# serves metrics.k8s.io; kubeglance never talks to metrics-server or kubelets
# directly), the peers and, with alerts on, the receiver.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubeglance.fullname" . }}
  labels:
    {{- include "kubeglance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubeglance.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kubeglance.selectorLabels" . | nindent 14 }}
        {{- with $np.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        {{- range $np.apiServer.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- with $np.apiServer.cidrs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "kubeglance.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- if include "kubeglance.alerts" . }}
    - ports:
        {{- range .Values.alerts.egress.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- with .Values.alerts.egress.cidrs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
