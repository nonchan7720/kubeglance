apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeglance.fullname" . }}
  labels:
    {{- include "kubeglance.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "kubeglance.selectorLabels" . | nindent 4 }}
---
# Headless Service: how a starting replica finds the running ones to copy
# the history from. publishNotReadyAddresses is off on purpose: only a replica
# that is Ready (has data) is a valid source.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeglance.fullname" . }}-peers
  labels:
    {{- include "kubeglance.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "kubeglance.selectorLabels" . | nindent 4 }}
