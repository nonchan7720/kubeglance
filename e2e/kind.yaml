# The end-to-end cluster (scripts/e2e.sh): two nodes, so the two kubeglance
# replicas spread and the node view has something to compare. The node
# image is the one kind v0.33.0 (mise.toml) pins by digest.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
