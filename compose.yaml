# Development dependencies. Only depgraph's Neo4j so far; it is behind a
# profile so `docker compose up -d` starts nothing by accident
# (`mise run neo4j` starts it by name).
services:
  neo4j:
    profiles: ["depgraph"]
    image: neo4j:5.26.32@sha256:249a1ec6e3c52d82101a5ed33d6ed2b5ed5b0017b21a28c0bfebc335e87fb177
    container_name: kubeglance-neo4j
    ports:
      - "127.0.0.1:27474:7474" # browser UI
      - "127.0.0.1:27687:7687" # bolt
    environment:
      NEO4J_AUTH: neo4j/kubeglance123
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  neo4j_data:
